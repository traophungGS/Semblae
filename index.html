<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semblæ Map</title>
    <link rel="stylesheet" href="index.css">
</head>

<style>
body{
    font-family: Arial;
    background:#eee;
    display:flex;
    justify-content:center;
    padding-top:40px;
}

.map{
    display:grid;
    grid-template-columns: repeat(6,70px);
    gap:5px;
}

.square{
    width:70px;
    height:70px;
    background:#ddd;
    border:1px solid #999;
    cursor:pointer;
    transition:0.2s;
}

.square:hover{
    background:orange;
}

.popup{
    position:absolute;
    background:rgba(0,0,0,0.75);
    color:white;
    padding:12px;
    border-radius:6px;
    display:none;
    width:340px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#4c7db3;
    padding:6px;
    text-align:left;
}

td{
    background:#cfd6df;
    padding:6px;
    color:black;
}
</style>
</head>

<body>
    <div class="newspaper">
        <h1>Semblæ</h1>
        <div class="meta">April 30, 2026 · Term 3<br>Election date: 1-5/4/2026 (Early vote: 16-17/3/2026)<br/></div>

<div class="map" id="map"></div>

<div class="popup" id="popup">
<h3 id="seat"></h3>
<div id="regions"></div>

<table>
<thead>
<tr>
<th>Choice</th>
<th>Total Votes</th>
<th>Percent</th>
</tr>
</thead>

<tbody id="results"></tbody>
</table>
</div>

<script>

const mapData = {

A:{seat:"Sexual and gender minorities 1",p:"2 of 2 Regions Reporting",results:[["orthodoron (SEC)",2,"100%"],["canceroustreasure (SEC)",0,"0%"],["Blank",0,"0%"]]},
B:{seat:"Sexual and gender minorities 2",p:"2 of 2 Regions Reporting",results:[[["canceroustreasure (SEC)",2,"100%"],["Blank",0,"0%"]]},
C:{seat:"The Secretariats (Round 2)",p:"2 of 2 Regions Reporting",results:[["canceroustreasure (SEC)",2,"66.67%"],["meadowie (EAS)",1,"33.33%"],["Blank",0,"0%"]]},
D:{seat:"AI Development Members Association 1 (Round 2)",p:"4 of 4 Regions Reporting",results:[["1234hunh (BLA)",2,"50%"],["ffsgje (GOO)",1000,"25%"],["Blank",0,"0%"]]},
E:{seat:"AI Development Members Association 2",p:"4 of 4 Regions Reporting",results:[["Candidate 1",4500,"58%"],["Candidate 2",1,"50%"],["Candidate 2",1,"50%"],["Candidate 2",3300,"42%"]]},
F:{seat:"AI Development Members Association 3",p:"4 of 4 Regions Reporting",results:[["Candidate 1",5500,"66%"],["Candidate 2",1,"50%"],["Candidate 2",2800,"34%"]]},
G:{seat:"AI Development Members Association 4",p:"4 of 4 Regions Reporting",results:[["Candidate 1",4700,"60%"],["Candidate 2",3100,"40%"]]},
H:{seat:"Philosophy Semblæ Area 1",p:"3 of 3 Regions Reporting",results:[["1234hunh (BLA)",2,"100%"],["orthodoron (SEC)",0,"0%"],["canceroustreasure (SEC)",0,"0%"],["Blank",0,"0%"]]},
I:{seat:"Philosophy Semblæ Area 2",p:"3 of 3 Regions Reporting",results:[["Candidate 1",5500,"66%"],["Candidate 2",1,"50%"],["Blank",2800,"34%"]]},
J:{seat:"Philosophy Semblæ Area 3",p:"3 of 3 Regions Reporting",results:[["Candidate 1",4700,"60%"],["Blank",3100,"40%"]]},
K:{seat:"Philosophy Semblæ Area 4",p:"0 of 0 Regions Reporting",results:[["Vacant",0,"100%"]]},
L:{seat:"Minority Semblæ Area 1",p:"0 of 0 Regions Reporting",results:[["Vacant",0,"100%"]]},
M:{seat:"Minority Semblæ Area 2",p:"0 of 0 Regions Reporting",results:[["Vacant",0,"100%"]]},
N:{seat:"Doanket 1",p:"4 of 4 Regions Reporting",results:[["easternfed (EAS)",2,"100%"],["1234hunh (BLA)",0,"0%"],["messex_fan (EAS)",0,"0%"],["Blank",0,"0%"]]},
O:{seat:"Doanket 2",p:"4 of 4 Regions Reporting",results:[["messex_fan (EAS)",4400,"100%"],["1234hunh (BLA)",0,"0%"],["Blank",0,"0%"]]},
P:{seat:"Doanket 3",p:"4 of 4 Regions Reporting | Electoral college",results:[["Candidate 2",2800,"100%"]]},
Q:{seat:"Podes",p:"3 of 3 Regions Reporting",results:[["ceelinder (SEC)",2,"50%"],["rabattues (EAS)",1,"25%"],["Blank",1,"25%"]]},
R:{seat:"Level 2 Militia Council 1",p:"4 of 4 Regions Reporting",results:[["messex_fan (EAS)",5,"55.56%"],["orthodoron (SEC)",3,"33.33%"],["ffsgje (GOO)",1,"11.11%"],["ceelinder (SEC)",0,"0%"],["rabattues (EAS)",0,"0%"],["fevga (EAS)",0,"0%"],["meadowie (EAS)",0,"0%"],["Blank",0,"0%"]]},
S:{seat:"Level 2 Militia Council 2",p:"4 of 4 Regions Reporting",results:[["Candidate 1",4500,"58%"],["Candidate 2",1,"50%"],["Candidate 2",1,"50%"],["Candidate 2",1,"50%"],["Candidate 2",1,"50%"],["Candidate 2",1,"50%"],["Blank",3300,"42%"]]},
T:{seat:"Level 2 Militia Council 3",p:"4 of 4 Regions Reporting",results:[["Candidate 1",4400,"56%"],["Candidate 2",1,"50%"],["Candidate 2",1,"50%"],["Candidate 2",1,"50%"],["Candidate 2",1,"50%"],["Blank",3400,"44%"]]},
U:{seat:"Level 2 Militia Council 4",p:"4 of 4 Regions Reporting",results:[["Candidate 1",4400,"56%"],["Candidate 2",1,"50%"],["Candidate 2",1,"50%"],["Candidate 2",1,"50%"],["Blank",3400,"44%"]]},
V:{seat:"Everyone 1",p:"9 of 9 Regions Reporting | Party-list proportional representation",results:[["Candidate 2",2800,"100%"]]},
W:{seat:"Everyone 2",p:"9 of 9 Regions Reporting | Party-list proportional representation",results:[["Candidate 2",2800,"100%"]]},
X:{seat:"Everyone 3",p:"9 of 9 Regions Reporting | Party-list proportional representation",results:[["Candidate 2",2800,"100%"]]},
Y:{seat:"Everyone 4",p:"9 of 9 Regions Reporting | Party-list proportional representation",results:[["Candidate 2",2800,"100%"]]},
Z:{seat:"Everyone 5",p:"9 of 9 Regions Reporting | Party-list proportional representation",results:[["Candidate 2",2800,"100%"]]}

};

const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const map=document.getElementById("map");
const popup=document.getElementById("popup");

for(let i=0;i<26;i++){

const sq=document.createElement("div");
sq.className="square";
sq.dataset.id=letters[i];

sq.addEventListener("mousemove",e=>{

const data=mapData[sq.dataset.id];

popup.style.display="block";
popup.style.left=e.pageX+15+"px";
popup.style.top=e.pageY+15+"px";

    document.getElementById("seat").innerText="Results for "+data.seat;
document.getElementById("regions").innerText=data.p;

const tbody=document.getElementById("results");
tbody.innerHTML="";

data.results.forEach(r=>{
tbody.innerHTML+=`
<tr>
<td>${r[0]}</td>
<td>${r[1].toLocaleString()}</td>
<td>${r[2]}</td>
</tr>`;
});

});

sq.addEventListener("mouseleave",()=>popup.style.display="none");

map.appendChild(sq);

}

</script>

</body>
</html>
